# Render Blueprint - provisions the Postgres instance and the Docker web
# service together from one "New Blueprint Instance". PostGIS itself still
# needs one manual `CREATE EXTENSION postgis;` afterward (not something a
# Blueprint's plain Postgres definition controls), and the env vars marked
# `sync: false` below need real values filled in via Render's dashboard
# (secrets, and values only known after the Vercel/R2 side exists - see
# README.md's deployment section).
#
# Lives at the repo root (not backend/) on purpose: Render auto-detects a
# Blueprint at the repository root, and dockerfilePath/dockerContext below
# are resolved relative to wherever this file sits - keeping it here, with
# root-relative paths into backend/, avoids that ambiguity entirely.
#
# No preDeployCommand here: that feature requires a paid plan. Migrations
# instead run as part of the Docker image's own start command (see
# backend/Dockerfile) - safe to run on every start since it's a no-op once
# there's nothing new to migrate.
databases:
  - name: survey-app-db
    databaseName: survey_app
    plan: free

services:
  - type: web
    name: survey-app-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: survey-app-db
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "True"
      # Fill in once you know this service's own onrender.com URL.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # Fill in once the Vercel frontend URL is known (see README.md).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Cloudflare R2 credentials - see README.md's deployment section.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
